<div id="loginPage" class="login-page"><div class="login-card"><div class="brand-en">CHILD CARE SUPPORT</div><h1>見学管理システム</h1><p>登録済みのGoogleアカウントで<br>ログインしてください。</p><div id="googleButton" style="display:flex;justify-content:center;margin-top:22px;min-height:42px"></div><div class="login-error" id="loginError" role="alert"></div><p class="login-note">職員専用の見学管理システムです。</p></div></div>
<div class="app" id="app" hidden><aside class="sidebar"><div class="brand"><div class="brand-en">CHILD CARE SUPPORT</div><div class="brand-title">見学管理</div><div class="brand-sub">VISIT MANAGEMENT SYSTEM</div></div><div class="nav-label">WORKSPACE</div><div class="nav-items"><button class="nav-btn active" id="navList" onclick="switchView('list')"><span class="nav-icon">▤</span>申込一覧</button><button class="nav-btn" id="navCalendar" onclick="switchView('calendar')"><span class="nav-icon">▦</span>カレンダー</button></div><div class="sidebar-bottom">CHILD CARE SUPPORT<br>見学管理システム<br><br><span style="color:#148b78;font-weight:700">● LIVE</span><br>スプレッドシート連携</div></aside><main class="main"><div class="topbar"><div><div class="eyebrow">VISIT MANAGEMENT</div><h1 id="pageTitle">見学申込一覧</h1></div><div class="top-actions"><div class="garden-switch" id="gardenSwitch"><button class="garden-btn active" data-garden="all" onclick="selectGarden('all')">全園</button><button class="garden-btn" data-garden="南花畑園" onclick="selectGarden('南花畑園')">南花畑園</button><button class="garden-btn" data-garden="梅島園" onclick="selectGarden('梅島園')">梅島園</button><button class="garden-btn" data-garden="保木間園" onclick="selectGarden('保木間園')">保木間園</button><button class="garden-btn" data-garden="ちびっこランド" onclick="selectGarden('ちびっこランド')">ちびっこランド</button></div><div class="user-badge"><span class="avatar" id="userAvatar">本</span><span id="userRole">本部</span></div><button class="logout" onclick="logout()">ログアウト</button></div></div><div class="stats" id="stats"></div><section class="view active" id="listView"><div class="panel"><div class="panel-head"><div><div class="panel-title" id="listTitle">すべての申込</div><div class="panel-sub" id="listSubtitle"></div></div><input class="search" id="searchInput" placeholder="お子さま・保護者名で検索" oninput="renderList()"></div><div class="table-wrap"><table><thead><tr><th>お子さま</th><th>申込園</th><th>対応状況</th><th>見学確定日</th><th>事前シート</th><th></th></tr></thead><tbody id="listBody"></tbody></table></div></div></section><section class="view" id="calendarView"><div class="panel"><div class="panel-head"><div><div class="panel-title">見学予定カレンダー</div><div class="panel-sub">確定した見学予定を園別に表示</div></div><div class="calendar-toolbar"><button class="icon-btn" onclick="changeMonth(-1)">‹</button><div class="month-title" id="monthTitle"></div><button class="icon-btn" onclick="changeMonth(1)">›</button><button class="icon-btn" onclick="goToday()">今日</button></div></div><div class="calendar-grid" id="calendarGrid"></div><div class="calendar-note">予定をクリックすると、申込者の詳細を確認できます。</div></div></section></main></div>

<script>
"use strict";
const CLIENT_ID="357085830532-ckltj936bt4bc8p0712bj92m1gg25llv.apps.googleusercontent.com";
const USERS={
"umejima.child.takahiro@gmail.com":{role:"本部",garden:"all"},
"k-takahashi@linkup6.com":{role:"本部",garden:"all"},
"tortoise.nursery@gmail.com":{role:"南花畑園",garden:"南花畑園"},
"tortoise.umejima@gmail.com":{role:"梅島園",garden:"梅島園"},
"tortoise.hokima@gmail.com":{role:"保木間園",garden:"保木間園"},
"chibiccoland-rokucho@linkup6.com":{role:"ちびっこランド",garden:"ちびっこランド"},
"chibicco6-director@linkup6.com":{role:"ちびっこランド",garden:"ちびっこランド"}
};
let applications=[];
let adminToken='';
// GASの公開URLを設定してください（末尾は /exec）。
const GAS_WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbwZaCZuEWMom6YFsxJ40O-fvVx_5LQH7EnZ4haHiby7r2w48EK_WO5czHHkbRVPHKqxVA/exec';
let requestSeq=0;
const pending=new Map();
function bridgeRequest(action,payload={}){
 return new Promise((resolve,reject)=>{
  if(!/^https:\/\/script\.google\.com\/macros\/s\/.+\/exec$/.test(GAS_WEB_APP_URL)){
   reject(new Error('GASのURLが未設定です。'));return;
  }
  const id='req_'+(++requestSeq)+'_'+Date.now();
  const frame=document.createElement('iframe');frame.name=id;frame.style.display='none';
  const form=document.createElement('form');form.method='POST';form.action=GAS_WEB_APP_URL;
  form.target=id;form.style.display='none';
  const fields={adminBridge:'1',requestId:id,idToken:adminToken,action,payload:JSON.stringify(payload)};
  for(const [key,value] of Object.entries(fields)){
   const input=document.createElement('input');input.type='hidden';input.name=key;input.value=value;form.appendChild(input);
  }
  document.body.append(frame,form);
  const timeout=setTimeout(()=>finish(new Error('通信がタイムアウトしました。GASの公開設定とURLを確認してください。')),30000);
  function finish(error,result){clearTimeout(timeout);pending.delete(id);form.remove();frame.remove();error?reject(error):resolve(result)}
  pending.set(id,finish);form.submit();
 });
}
window.addEventListener('message',event=>{
 // GAS HTML Serviceの応答のみを受信。IDは推測困難なリクエスト単位。
 if(!/^https:\/\/[a-z0-9-]+\.googleusercontent\.com$/.test(event.origin) &&
    event.origin!=='https://script.google.com')return;
 const d=event.data;
 if(!d||d.type!=='CCS_ADMIN_BRIDGE'||typeof d.requestId!=='string')return;
 const done=pending.get(d.requestId);if(!done)return;
 done(d.success?null:new Error(d.message||'通信に失敗しました。'),d.result);
});
function reloadApplications(){
 if(!adminToken)return;
 bridgeRequest('read').then(result=>{
   const grouped=new Map();
   for(const item of result.items){
     const key=(item.lineUserId||item.guardian+'|'+item.phone)+'|'+item.child+'|'+item.birthday;
     if(!grouped.has(key))grouped.set(key,{id:item.id,child:item.child,birthday:item.birthday,guardian:item.guardian,phone:item.phone,previsit:false,visits:[]});
     const a=grouped.get(key);a.previsit=a.previsit||item.previsit;
     a.visits.push({id:item.id,garden:item.garden,status:item.status,wishes:item.wishes,confirmed:item.confirmed,time:item.time,memo:item.memo,desiredDays:item.desiredDays||"",careStart:item.careStart||"",careEnd:item.careEnd||"",previsit:item.previsit});
   }
   applications=[...grouped.values()];renderAll();
 }).catch(err=>{alert('申込データを取得できません：'+err.message)});
}
const statuses=[{name:"未対応",className:"new"},{name:"日程調整",className:"adjust"},{name:"確定済み",className:"fixed"},{name:"見学済み",className:"done"},{name:"キャンセル",className:"cancel"}];
const gardenColors={"南花畑園":"#148b78","梅島園":"#688ad0","保木間園":"#d29a59","ちびっこランド":"#bb83b7"};
const $=id=>document.getElementById(id);const esc=x=>String(x??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");
let activeStatus="all",selectedGarden="all",currentView="list",currentUser=null;const now=new Date();let calendarYear=now.getFullYear(),calendarMonth=now.getMonth();



/* Google Identity Services: Google認証結果を表示する試作です。実運用ではIDトークンをサーバー側で検証する必要があります。 */
function startGoogleLogin(){if(!window.google?.accounts?.id){$("loginError").textContent="Googleログインの読み込みを待って、もう一度お試しください。";return}$("loginError").textContent="";google.accounts.id.prompt(notification=>{if(notification.isNotDisplayed()||notification.isSkippedMoment()){$("loginError").textContent="ログイン画面が出ない場合は、ブラウザのポップアップやCookie設定をご確認ください。"}})}
function decodeJWT(token){const part=token.split(".")[1];if(!part)throw Error("Invalid token");const b64=part.replace(/-/g,"+").replace(/_/g,"/");const bytes=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));return JSON.parse(new TextDecoder().decode(bytes))}
function handleCredential(response){try{const data=decodeJWT(response.credential);const email=String(data.email||"").toLowerCase();if(data.aud!==CLIENT_ID||!data.email_verified||!data.exp||data.exp*1000<=Date.now()||!USERS[email]){$("loginError").textContent="このGoogleアカウントは登録されていません。";return}adminToken=response.credential;currentUser={email,...USERS[email]};$("loginPage").hidden=true;$("app").hidden=false;$("loginPage").style.display="none";$("app").style.display="flex";$("userRole").textContent=currentUser.role;$("userAvatar").textContent=currentUser.role==="本部"?"本":currentUser.role.charAt(0);selectGarden(currentUser.garden);reloadApplications()}catch(e){console.error(e);$("loginError").textContent="ログイン情報を確認できませんでした。"}}
function initGoogle(){if(!window.google?.accounts?.id){setTimeout(initGoogle,300);return}google.accounts.id.initialize({client_id:CLIENT_ID,callback:handleCredential,auto_select:false,ux_mode:"popup"});google.accounts.id.renderButton($("googleButton"),{type:"standard",theme:"outline",size:"large",text:"signin_with",shape:"pill",width:250});}
window.addEventListener("load",initGoogle);
function logout(){currentUser=null;adminToken="";applications=[];google?.accounts?.id?.disableAutoSelect();$("app").style.display="none";$("loginPage").style.display="grid";$("loginError").textContent="";closeDetail()}
function getGarden(){return selectedGarden}function selectGarden(g){selectedGarden=g;document.querySelectorAll(".garden-btn").forEach(b=>b.classList.toggle("active",b.dataset.garden===g));renderAll()}
function visibleVisits(a){return a.visits.filter(v=>getGarden()==="all"||v.garden===getGarden())}function getFilteredApplications(){return applications.filter(a=>visibleVisits(a).length)}
function statusClass(s){return statuses.find(x=>x.name===s)?.className||"new"}function badge(s){return `<span class="pill ${statusClass(s)}">${esc(s)}</span>`}function gardenLabel(g){return `<span class="garden-item"><span class="dot" style="background:${gardenColors[g]||'#148b78'}"></span>${esc(g)}</span>`}function formatDate(s){if(!s)return "未定";const p=s.split("-");return p.length===3?`${Number(p[1])}月${Number(p[2])}日`:s}
function renderStats(){const apps=getFilteredApplications();$("stats").innerHTML=statuses.map(s=>`<button class="stat ${activeStatus===s.name?'active':''}" onclick="selectStatus('${s.name}')"><div class="stat-label">${s.name}</div><div class="stat-number">${apps.filter(a=>visibleVisits(a).some(v=>v.status===s.name)).length}<small>件</small></div></button>`).join("")}
function selectStatus(s){activeStatus=activeStatus===s?"all":s;switchView("list")}
function renderList(){const q=$("searchInput").value.trim().toLowerCase();const apps=getFilteredApplications().filter(a=>(activeStatus==="all"||visibleVisits(a).some(v=>v.status===activeStatus))&&`${a.child} ${a.guardian} ${a.phone}`.toLowerCase().includes(q));$("listTitle").textContent=activeStatus==="all"?"すべての申込":activeStatus;$("listSubtitle").textContent=`${apps.length}名のお子さまを表示しています`;$("listBody").innerHTML=apps.length?apps.map(a=>{const vs=visibleVisits(a).filter(v=>activeStatus==="all"||v.status===activeStatus);return `<tr onclick="openDetail('${esc(a.id)}')"><td><div class="child-name">${esc(a.child)}</div><div class="muted">${esc(a.guardian)} 様</div>${a.visits.length>1?`<div style="margin-top:8px"><span class="pill multi">複数園 ${a.visits.length}園</span></div>`:""}</td><td><div class="garden-stack">${vs.map(v=>gardenLabel(v.garden)).join("")}</div></td><td><div class="garden-stack">${vs.map(v=>badge(v.status)).join("")}</div></td><td><div class="garden-stack">${vs.map(v=>`<span>${esc(formatDate(v.confirmed))} ${esc(v.time)}</span>`).join("")}</div></td><td>${a.previsit?'<span class="pill fixed">回答済み</span>':'<span class="pill new">未回答</span>'}</td><td style="color:#148b78;font-weight:800">詳細 ›</td></tr>`}).join(""):'<tr><td colspan="6"><div class="empty">該当する申込はありません</div></td></tr>'}
function switchView(v){currentView=v;$("listView").classList.toggle("active",v==="list");$("calendarView").classList.toggle("active",v==="calendar");$("navList").classList.toggle("active",v==="list");$("navCalendar").classList.toggle("active",v==="calendar");$("pageTitle").textContent=v==="list"?"見学申込一覧":"見学カレンダー";renderAll()}
function renderCalendar(){$("monthTitle").textContent=`${calendarYear}年 ${calendarMonth+1}月`;const first=new Date(calendarYear,calendarMonth,1),offset=first.getDay(),days=new Date(calendarYear,calendarMonth+1,0).getDate(),total=Math.ceil((offset+days)/7)*7,today=new Date(),events=[];getFilteredApplications().forEach(a=>visibleVisits(a).forEach(v=>{if(v.confirmed&&["確定済み","見学済み"].includes(v.status))events.push({appId:a.id,child:a.child,...v})}));let html=["日","月","火","水","木","金","土"].map(d=>`<div class="weekday">${d}</div>`).join("");for(let i=0;i<total;i++){const dt=new Date(calendarYear,calendarMonth,i-offset+1),key=`${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`,other=dt.getMonth()!==calendarMonth,isToday=dt.toDateString()===today.toDateString(),items=events.filter(e=>e.confirmed===key).sort((a,b)=>a.time.localeCompare(b.time));html+=`<div class="day ${other?'other':''} ${isToday?'today':''}"><div class="day-number">${dt.getDate()}</div>${items.map(e=>`<button class="event" style="border-left-color:${gardenColors[e.garden]||'#148b78'};background:${gardenColors[e.garden]||'#148b78'}15" onclick="openDetail('${esc(e.appId)}')"><span class="event-time">${esc(e.time)}</span>${esc(e.garden)}<br>${esc(e.child)}</button>`).join("")}</div>`}$("calendarGrid").innerHTML=html}
function changeMonth(n){const d=new Date(calendarYear,calendarMonth+n,1);calendarYear=d.getFullYear();calendarMonth=d.getMonth();renderCalendar()}function goToday(){const d=new Date();calendarYear=d.getFullYear();calendarMonth=d.getMonth();renderCalendar()}
function infoRow(label,value){return `<div class="info-row"><div class="info-label">${esc(label)}</div><div class="info-value">${esc(value||'未登録')}</div></div>`}
function openDetail(id){const a=applications.find(x=>x.id===id);if(!a)return;const cards=a.visits.map((v,i)=>`<div class="visit-card"><div class="visit-card-head"><div class="visit-garden">${gardenLabel(v.garden)}</div>${badge(v.status)}</div><div class="visit-info"><strong>第1希望：</strong>${esc(v.wishes?.[0]||'未登録')}</div><div class="visit-info"><strong>第2希望：</strong>${esc(v.wishes?.[1]||'未登録')}</div><div class="visit-info"><strong>確定日時：</strong>${v.confirmed?`${esc(formatDate(v.confirmed))} ${esc(v.time)}`:'未確定'}</div><div class="edit-area"><div class="edit-title">管理情報を編集</div><div class="edit-field"><label class="edit-label">対応状況</label><select class="edit-input" id="status_${i}">${statuses.map(s=>`<option value="${s.name}" ${v.status===s.name?'selected':''}>${s.name}</option>`).join('')}</select></div><div class="edit-grid"><div class="edit-field"><label class="edit-label">見学確定日</label><input type="date" class="edit-input" id="date_${i}" value="${esc(v.confirmed)}"></div><div class="edit-field"><label class="edit-label">見学確定時間</label><input type="time" class="edit-input" id="time_${i}" value="${esc(v.time)}"></div></div><div class="edit-field"><label class="edit-label">希望曜日</label><input class="edit-input" id="days_${i}" value="${esc(v.desiredDays||'')}" placeholder="例：月・火・水・木・金"></div><div class="edit-grid"><div class="edit-field"><label class="edit-label">希望保育開始時間</label><input type="time" class="edit-input" id="careStart_${i}" value="${esc(v.careStart||'')}"></div><div class="edit-field"><label class="edit-label">希望保育終了時間</label><input type="time" class="edit-input" id="careEnd_${i}" value="${esc(v.careEnd||'')}"></div></div><div class="edit-field"><label class="edit-label">職員メモ</label><textarea class="edit-input" id="memo_${i}" placeholder="日程調整の経緯や引き継ぎ事項など">${esc(v.memo||'')}</textarea></div><button class="save-btn" onclick="saveVisit('${esc(a.id)}',${i})">この園の変更を保存</button><div class="save-message" id="saveMessage_${i}" role="status"></div></div></div>`).join('');$("detailBody").innerHTML=`<div class="profile"><div class="profile-name">${esc(a.child)}</div><div class="profile-sub">${esc(a.guardian)} 様</div><div style="margin-top:15px"><span class="pill ${a.visits.length>1?'multi':'fixed'}">${a.visits.length>1?`複数園 ${a.visits.length}園`:'1園申込'}</span></div></div><div class="detail-section"><h3>お子さま・保護者情報</h3>${infoRow('お子さま',a.child)}${infoRow('生年月日',a.birthday)}${infoRow('保護者名',a.guardian)}${infoRow('電話番号',a.phone)}</div><div class="detail-section"><h3>園ごとの見学申込</h3>${cards}</div><div class="detail-section"><h3>事前シート</h3>${a.previsit?'<span class="pill fixed">回答済み・共通</span>':'<span class="pill new">未回答</span>'}<div class="muted" style="margin-top:12px">同じお子さまの複数園申込で、事前シートを共有します。</div></div><div class="demo-note">変更内容はGoogleスプレッドシートに保存されます。<br>他の端末の最新情報を確認するにはページを再読み込みしてください。</div>`;$("modal").classList.add("open");document.body.style.overflow="hidden"}
function saveVisit(id,i){
 const a=applications.find(x=>x.id===id);if(!a||!a.visits[i]||!currentUser||!adminToken)return;
 const v=a.visits[i],status=$(`status_${i}`).value,confirmed=$(`date_${i}`).value,time=$(`time_${i}`).value,memo=$(`memo_${i}`).value,desiredDays=$(`days_${i}`).value,careStart=$(`careStart_${i}`).value,careEnd=$(`careEnd_${i}`).value,msg=$(`saveMessage_${i}`);
 const fail=s=>{msg.textContent=s;msg.style.color='#b85c5c'};
 if(['確定済み','見学済み'].includes(status)&&(!confirmed||!time))return fail('確定済み・見学済みは日時が必要です。');
 if(Boolean(confirmed)!==Boolean(time))return fail('日付と時間は両方入力してください。');
 msg.textContent='保存中…';
 bridgeRequest('save',{id:v.id,status,confirmed,time,memo,desiredDays,careStart,careEnd})
 .then(()=>{msg.textContent='✓ 保存しました';msg.style.color='#148b78';reloadApplications();})
 .catch(err=>fail('保存失敗：'+err.message));
}
function closeDetail(){$("modal").classList.remove('open');document.body.style.overflow=''}function closeOnOverlay(e){if(e.target===$("modal"))closeDetail()}document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDetail()});function renderAll(){renderStats();renderList();renderCalendar()}renderAll();
</script></body></html>
