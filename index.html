<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>見学管理 | CHILD CARE SUPPORT</title>

<style>
:root{
  --green:#148b78;
  --dark:#107c6b;
  --mint:#d9f0ed;
  --pale:#e6f3f0;
  --bg:#f6f8f7;
  --white:#fff;
  --text:#252d2c;
  --sub:#7a8582;
  --line:#e8eeeb;
  --shadow:0 8px 30px rgba(35,105,91,.06);
}

*{box-sizing:border-box}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,
  "Helvetica Neue","Hiragino Sans","Yu Gothic",sans-serif;
  font-size:14px;
}

button,input,select{font:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{
  outline:3px solid #a5dcd2;
  outline-offset:2px;
}

.app{display:flex;min-height:100vh}

/* サイドバー */
.sidebar{
  width:246px;
  flex-shrink:0;
  background:#fff;
  border-right:1px solid var(--line);
  padding:30px 18px;
}

.brand{
  padding:4px 14px 36px;
}

.brand-en{
  color:var(--green);
  font-size:10px;
  font-weight:800;
  letter-spacing:.16em;
}

.brand-title{
  margin-top:8px;
  font-size:19px;
  font-weight:800;
}

.brand-sub{
  margin-top:5px;
  color:var(--sub);
  font-size:11px;
}

.nav-label{
  margin:0 14px 12px;
  color:#a2aaa7;
  font-size:10px;
  font-weight:700;
  letter-spacing:.12em;
}

.nav-btn{
  display:flex;
  align-items:center;
  gap:12px;
  width:100%;
  margin:5px 0;
  padding:14px 15px;
  border:0;
  border-radius:12px;
  background:transparent;
  color:#68736f;
  text-align:left;
  font-weight:650;
}

.nav-btn.active{
  background:var(--pale);
  color:var(--green);
}

.nav-icon{font-size:19px}

.sidebar-bottom{
  margin-top:45px;
  padding:17px 14px;
  border-top:1px solid var(--line);
  color:var(--sub);
  font-size:12px;
  line-height:1.8;
}

/* メイン */
.main{
  flex:1;
  min-width:0;
  padding:35px 42px 70px;
}

.topbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:20px;
  margin-bottom:32px;
}

.eyebrow{
  color:var(--green);
  font-size:11px;
  font-weight:800;
  letter-spacing:.12em;
}

h1{
  margin:6px 0 0;
  font-size:27px;
  font-weight:800;
  letter-spacing:.02em;
}

.top-actions{
  display:flex;
  align-items:center;
  gap:12px;
}

.select{
  min-height:43px;
  padding:0 36px 0 15px;
  border:1px solid var(--line);
  border-radius:10px;
  background:#fff;
  color:var(--text);
}

.user-badge{
  display:flex;
  align-items:center;
  gap:9px;
  padding:8px 12px;
  border:1px solid var(--line);
  border-radius:12px;
  background:#fff;
  white-space:nowrap;
}

.avatar{
  display:grid;
  place-items:center;
  width:28px;
  height:28px;
  border-radius:50%;
  background:var(--pale);
  color:var(--green);
  font-weight:800;
}

/* 集計カード */
.stats{
  display:grid;
  grid-template-columns:repeat(5,minmax(0,1fr));
  gap:13px;
  margin-bottom:26px;
}

.stat{
  padding:19px;
  border:1px solid var(--line);
  border-radius:16px;
  background:#fff;
  text-align:left;
  box-shadow:var(--shadow);
  transition:.2s;
}

.stat:hover{transform:translateY(-2px)}

.stat.active{
  border-color:#9bd5ca;
  background:#f0faf7;
}

.stat-label{
  color:var(--sub);
  font-size:12px;
  font-weight:650;
}

.stat-number{
  margin-top:9px;
  font-size:29px;
  font-weight:800;
}

.stat-number small{
  margin-left:3px;
  color:var(--sub);
  font-size:12px;
  font-weight:500;
}

/* 共通カード */
.panel{
  overflow:hidden;
  border:1px solid var(--line);
  border-radius:18px;
  background:#fff;
  box-shadow:var(--shadow);
}

.panel-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
  padding:24px 26px;
  border-bottom:1px solid var(--line);
}

.panel-title{
  font-size:17px;
  font-weight:800;
}

.panel-sub{
  margin-top:5px;
  color:var(--sub);
  font-size:12px;
}

.search{
  width:255px;
  max-width:100%;
  padding:11px 14px;
  border:1px solid var(--line);
  border-radius:10px;
  background:#f7f9f8;
  outline:none;
}

.search:focus{
  border-color:var(--green);
  background:#fff;
}

/* 一覧 */
.table-wrap{overflow-x:auto}

table{
  width:100%;
  border-collapse:collapse;
  white-space:nowrap;
}

th{
  padding:16px 23px;
  background:#fafbfa;
  color:#87918e;
  font-size:11px;
  font-weight:700;
  text-align:left;
}

td{
  padding:20px 23px;
  border-top:1px solid #f0f3f1;
  vertical-align:middle;
}

tbody tr{
  cursor:pointer;
  transition:background .15s;
}

tbody tr:hover{background:#f4faf8}

.child-name{font-weight:800}

.muted{
  margin-top:5px;
  color:var(--sub);
  font-size:12px;
}

.pill{
  display:inline-block;
  padding:6px 10px;
  border-radius:7px;
  font-size:11px;
  font-weight:750;
}

.pill.new{background:#fff0e3;color:#bd7a37}
.pill.adjust{background:#eef1ff;color:#6374c2}
.pill.fixed{background:#e3f5ee;color:#23866b}
.pill.done{background:#eef1f0;color:#64726d}
.pill.cancel{background:#fcebec;color:#b46b72}
.pill.multi{background:#e7f3f0;color:#148b78}

.garden-stack{
  display:flex;
  flex-direction:column;
  gap:6px;
  align-items:flex-start;
}

.garden-item{
  display:flex;
  align-items:center;
  gap:7px;
}

.dot{
  display:inline-block;
  width:8px;
  height:8px;
  flex-shrink:0;
  border-radius:50%;
}

.empty{
  padding:60px 20px;
  color:var(--sub);
  text-align:center;
}

/* カレンダー */
.calendar-toolbar{
  display:flex;
  align-items:center;
  gap:10px;
}

.icon-btn{
  min-width:37px;
  height:37px;
  border:1px solid var(--line);
  border-radius:9px;
  background:#fff;
  color:var(--text);
}

.month-title{
  min-width:125px;
  font-size:17px;
  font-weight:800;
  text-align:center;
}

.calendar-grid{
  display:grid;
  grid-template-columns:repeat(7,minmax(0,1fr));
}

.weekday{
  padding:13px 8px;
  border-bottom:1px solid var(--line);
  color:var(--sub);
  text-align:center;
  font-size:12px;
  font-weight:700;
}

.weekday:first-child{color:#d57979}
.weekday:nth-child(7){color:#668ec5}

.day{
  min-height:130px;
  padding:9px;
  border-right:1px solid var(--line);
  border-bottom:1px solid var(--line);
  background:#fff;
  min-width:0;
}

.day:nth-child(7n){border-right:0}
.day.other{background:#fafbfa}
.day.today{background:#f1faf7}

.day-number{
  margin-bottom:8px;
  font-size:12px;
  font-weight:750;
}

.day.other .day-number{color:#b8c0bc}

.event{
  display:block;
  width:100%;
  margin-bottom:5px;
  padding:7px 8px;
  border:0;
  border-left:3px solid var(--green);
  border-radius:5px;
  background:#edf8f4;
  color:#385b51;
  text-align:left;
  font-size:11px;
  line-height:1.5;
  overflow-wrap:anywhere;
}

.event:hover{filter:brightness(.96)}

.event-time{
  display:block;
  font-weight:800;
}

.calendar-note{
  padding:17px 24px;
  color:var(--sub);
  font-size:12px;
}

/* 詳細 */
.modal-overlay{
  position:fixed;
  inset:0;
  z-index:100;
  display:none;
  justify-content:flex-end;
  background:rgba(23,41,35,.35);
}

.modal-overlay.open{display:flex}

.detail{
  width:min(560px,100%);
  height:100%;
  overflow-y:auto;
  background:#fff;
  box-shadow:-15px 0 45px rgba(0,0,0,.08);
}

.detail-head{
  position:sticky;
  top:0;
  z-index:2;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:23px 28px;
  border-bottom:1px solid var(--line);
  background:#fff;
}

.detail-title{
  font-size:18px;
  font-weight:800;
}

.close-btn{
  width:36px;
  height:36px;
  border:0;
  border-radius:50%;
  background:#f2f4f3;
  font-size:20px;
}

.detail-body{padding:28px}

.profile{
  padding:23px;
  border-radius:16px;
  background:#f2faf7;
}

.profile-name{
  font-size:23px;
  font-weight:800;
}

.profile-sub{
  margin-top:8px;
  color:var(--sub);
  font-size:13px;
}

.detail-section{
  margin-top:29px;
}

.detail-section h3{
  margin:0 0 16px;
  padding-bottom:11px;
  border-bottom:2px solid #cce7e2;
  color:var(--green);
  font-size:15px;
}

.info-row{
  display:grid;
  grid-template-columns:135px minmax(0,1fr);
  gap:12px;
  padding:12px 2px;
  border-bottom:1px solid var(--line);
}

.info-label{
  color:var(--sub);
  font-size:12px;
}

.info-value{
  font-weight:650;
  overflow-wrap:anywhere;
}

.visit-card{
  margin-bottom:13px;
  padding:18px;
  border:1px solid var(--line);
  border-radius:13px;
}

.visit-card-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  margin-bottom:13px;
}

.visit-garden{font-weight:800}

.visit-info{
  margin:8px 0;
  color:#57625e;
  font-size:13px;
}

.demo-note{
  margin-top:25px;
  padding:15px;
  border-radius:10px;
  background:#fff8e8;
  color:#926d2e;
  font-size:12px;
  line-height:1.8;
}

/* 画面切替 */
.view{display:none}
.view.active{display:block}

@media(max-width:1150px){
  .main{padding:28px 24px}
  .stats{gap:8px}
  .stat{padding:14px}
  .day{min-height:105px}
}

@media(max-width:800px){
  .app{display:block}
  .sidebar{
    width:100%;
    padding:16px;
    border-right:0;
    border-bottom:1px solid var(--line);
  }
  .brand{padding:0 0 12px}
  .nav-label,.sidebar-bottom{display:none}
  .nav-items{display:flex;gap:8px}
  .nav-btn{width:auto;padding:10px 14px}
  .main{padding:22px 14px}
  .topbar{align-items:flex-start;flex-direction:column}
  .stats{grid-template-columns:repeat(3,minmax(0,1fr))}
  .panel-head{padding:18px;flex-wrap:wrap}
  .search{width:100%}
  .day{min-height:90px;padding:5px}
  .event{font-size:10px;padding:5px}
}

@media(max-width:500px){
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .calendar-grid{font-size:11px}
  .day{min-height:70px}
  .event{font-size:9px}
  .detail-body{padding:18px}
  .info-row{grid-template-columns:100px 1fr}
}
</style>
</head>

<body>

<div class="app">

  <aside class="sidebar">
    <div class="brand">
      <div class="brand-en">CHILD CARE SUPPORT</div>
      <div class="brand-title">見学管理</div>
      <div class="brand-sub">VISIT MANAGEMENT SYSTEM</div>
    </div>

    <div class="nav-label">WORKSPACE</div>

    <div class="nav-items">
      <button class="nav-btn active" id="navList" onclick="switchView('list')">
        <span class="nav-icon">▤</span> 申込一覧
      </button>
      <button class="nav-btn" id="navCalendar" onclick="switchView('calendar')">
        <span class="nav-icon">▦</span> カレンダー
      </button>
    </div>

    <div class="sidebar-bottom">
      CHILD CARE SUPPORT<br>
      見学管理システム<br><br>
      <span style="color:#148b78;font-weight:700">● DEMO MODE</span><br>
      サンプルデータで動作中
    </div>
  </aside>

  <main class="main">

    <div class="topbar">
      <div>
        <div class="eyebrow">VISIT MANAGEMENT</div>
        <h1 id="pageTitle">見学申込一覧</h1>
      </div>

      <div class="top-actions">
        <select class="select" id="gardenFilter" onchange="renderAll()">
          <option value="all">すべての園</option>
          <option value="南花畑園">南花畑園</option>
          <option value="梅島園">梅島園</option>
          <option value="保木間園">保木間園</option>
          <option value="ちびっこ六町">ちびっこ六町</option>
        </select>

        <div class="user-badge">
          <span class="avatar">本</span>
          <span>本部管理者</span>
        </div>
      </div>
    </div>

    <div class="stats" id="stats"></div>

    <!-- 申込一覧 -->
    <section class="view active" id="listView">
      <div class="panel">

        <div class="panel-head">
          <div>
            <div class="panel-title" id="listTitle">すべての申込</div>
            <div class="panel-sub" id="listSubtitle"></div>
          </div>

          <input
            class="search"
            id="searchInput"
            placeholder="お子さま・保護者名で検索"
            oninput="renderList()"
          >
        </div>

        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>お子さま</th>
                <th>申込園</th>
                <th>対応状況</th>
                <th>見学確定日</th>
                <th>事前シート</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="listBody"></tbody>
          </table>
        </div>

      </div>
    </section>

    <!-- カレンダー -->
    <section class="view" id="calendarView">
      <div class="panel">

        <div class="panel-head">
          <div>
            <div class="panel-title">見学予定カレンダー</div>
            <div class="panel-sub">確定した見学予定を園別に表示</div>
          </div>

          <div class="calendar-toolbar">
            <button class="icon-btn" onclick="changeMonth(-1)" aria-label="前月">‹</button>
            <div class="month-title" id="monthTitle"></div>
            <button class="icon-btn" onclick="changeMonth(1)" aria-label="翌月">›</button>
            <button class="icon-btn" onclick="goToday()">今日</button>
          </div>
        </div>

        <div class="calendar-grid" id="calendarGrid"></div>

        <div class="calendar-note">
          予定をクリックすると、申込者の詳細を確認できます。
        </div>

      </div>
    </section>

  </main>
</div>

<!-- 詳細パネル -->
<div class="modal-overlay" id="modal" onclick="closeOnOverlay(event)">
  <div class="detail" role="dialog" aria-modal="true" aria-label="申込詳細">

    <div class="detail-head">
      <div class="detail-title">申込詳細</div>
      <button class="close-btn" onclick="closeDetail()" aria-label="閉じる">×</button>
    </div>

    <div class="detail-body" id="detailBody"></div>

  </div>
</div>

<script>
"use strict";

/*
  ========================================
  サンプルデータ
  実在する保護者・お子さまの情報ではありません。
  ========================================
*/

const applications = [

      }
    ]
  },
  {
    id:"C003",

    birthday:"2024-08-03",
    guardian:"田中 彩",
    phone:"090-0000-0003",
    previsit:true,
    visits:[
      {
        garden:"ちびっこ六町",
        status:"確定済み",
        wishes:["2026-10-19 午前","2026-10-20 午前"],
        confirmed:"2026-10-20",
        time:"10:30"
      }
    ]
  },
  {
    id:"C004",
    child:"鈴木 あおい",
    birthday:"2023-11-27",
    guardian:"鈴木 優子",
    phone:"090-0000-0004",
    previsit:true,
    visits:[
      {
        garden:"南花畑園",

        confirmed:"2026-10-08",
        time:"11:00"
      },
      {
        garden:"保木間園",
        status:"確定済み",
        wishes:["2026-10-23 午後"],
        confirmed:"2026-10-23",
        time:"14:00"
      }
    ]
  },
  {
    id:"C005",
    child:"高橋 みお",
    birthday:"2025-03-09",
    guardian:"高橋 真由",
    phone:"090-0000-0005",
    previsit:false,
    visits:[
      {
        garden:"梅島園",
        status:"キャンセル",
        wishes:["2026-10-14 午前"],
        confirmed:"",
        time:""
      }
    ]
  },
  {
    id:"C006",
    child:"小林 ゆう",
    birthday:"2024-12-15",
    guardian:"小林 愛",
    phone:"090-0000-0006",
    previsit:true,
    visits:[
      {
        garden:"梅島園",
        status:"確定済み",
        wishes:["2026-10-16 午前"],
        confirmed:"2026-10-16",
        time:"11:00"
      },
      {
        garden:"南花畑園",
        status:"確定済み",
        wishes:["2026-10-27 午前"],
        confirmed:"2026-10-27",
        time:"10:00"
      }
    ]
  }
];

const statuses = [
  {name:"未対応",className:"new"},
  {name:"日程調整",className:"adjust"},
  {name:"確定済み",className:"fixed"},
  {name:"見学済み",className:"done"},
  {name:"キャンセル",className:"cancel"}
];

const gardenColors = {
  "南花畑園":"#148b78",
  "梅島園":"#688ad0",
  "保木間園":"#d29a59",
  "ちびっこ六町":"#bb83b7"
};

let activeStatus = "all";
let currentView = "list";

const now = new Date();
let calendarYear = now.getFullYear();
let calendarMonth = now.getMonth();

const $ = id => document.getElementById(id);

function escapeHTML(value){
  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#39;");
}

function getGarden(){
  return $("gardenFilter").value;
}

function visibleVisits(app){
  const garden = getGarden();

  return app.visits.filter(v =>
    garden === "all" || v.garden === garden
  );
}

function getFilteredApplications(){
  return applications.filter(app => visibleVisits(app).length > 0);
}

function statusClass(status){
  return statuses.find(s => s.name === status)?.className || "new";
}

function badge(status){
  return `<span class="pill ${statusClass(status)}">${escapeHTML(status)}</span>`;
}

function gardenLabel(garden){
  const color = gardenColors[garden] || "#148b78";

  return `
    <span class="garden-item">
      <span class="dot" style="background:${color}"></span>
      ${escapeHTML(garden)}
    </span>
  `;
}

function formatDate(value){
  if(!value) return "未定";
  const parts = value.split("-");
  return `${Number(parts[1])}月${Number(parts[2])}日`;
}

function renderStats(){
  const apps = getFilteredApplications();

  $("stats").innerHTML = statuses.map(s => {
    const count = apps.filter(app =>
      visibleVisits(app).some(v => v.status === s.name)
    ).length;

    return `
      <button
        class="stat ${activeStatus === s.name ? "active" : ""}"
        onclick="selectStatus('${s.name}')"
      >
        <div class="stat-label">${s.name}</div>
        <div class="stat-number">${count}<small>件</small></div>
      </button>
    `;
  }).join("");
}

function selectStatus(status){
  activeStatus = activeStatus === status ? "all" : status;
  switchView("list");
}

function renderList(){
  const query = $("searchInput").value.trim().toLowerCase();

  const apps = getFilteredApplications().filter(app => {
    const visits = visibleVisits(app);

    const statusMatch =
      activeStatus === "all" ||
      visits.some(v => v.status === activeStatus);

    const textMatch =
      `${app.child} ${app.guardian} ${app.phone}`
        .toLowerCase()
        .includes(query);

    return statusMatch && textMatch;
  });

  $("listTitle").textContent =
    activeStatus === "all" ? "すべての申込" : activeStatus;

  $("listSubtitle").textContent =
    `${apps.length}名のお子さまを表示しています`;

  $("listBody").innerHTML = apps.length
    ? apps.map(app => {
        const visits = visibleVisits(app);

        const relevantVisits = activeStatus === "all"
          ? visits
          : visits.filter(v => v.status === activeStatus);

        const allVisits = app.visits;

        return `
          <tr onclick="openDetail('${app.id}')">
            <td>
              <div class="child-name">${escapeHTML(app.child)}</div>
              <div class="muted">${escapeHTML(app.guardian)} 様</div>
              ${
                allVisits.length > 1
                ? `<div style="margin-top:8px">
                     <span class="pill multi">複数園 ${allVisits.length}園</span>
                   </div>`
                : ""
              }
            </td>

            <td>
              <div class="garden-stack">
                ${relevantVisits.map(v => gardenLabel(v.garden)).join("")}
              </div>
            </td>

            <td>
              <div class="garden-stack">
                ${relevantVisits.map(v => badge(v.status)).join("")}
              </div>
            </td>

            <td>
              <div class="garden-stack">
                ${relevantVisits.map(v => `
                  <span>
                    ${escapeHTML(formatDate(v.confirmed))}
                    ${escapeHTML(v.time)}
                  </span>
                `).join("")}
              </div>
            </td>

            <td>
              ${
                app.previsit
                ? `<span class="pill fixed">回答済み</span>`
                : `<span class="pill new">未回答</span>`
              }
            </td>

            <td style="color:#148b78;font-weight:800">詳細 ›</td>
          </tr>
        `;
      }).join("")
    : `<tr><td colspan="6">
         <div class="empty">該当する申込はありません</div>
       </td></tr>`;
}

function switchView(view){
  currentView = view;

  $("listView").classList.toggle("active",view === "list");
  $("calendarView").classList.toggle("active",view === "calendar");

  $("navList").classList.toggle("active",view === "list");
  $("navCalendar").classList.toggle("active",view === "calendar");

  $("pageTitle").textContent =
    view === "list" ? "見学申込一覧" : "見学カレンダー";

  renderAll();
}

function renderCalendar(){
  $("monthTitle").textContent =
    `${calendarYear}年 ${calendarMonth + 1}月`;

  const firstDay = new Date(calendarYear,calendarMonth,1);
  const offset = firstDay.getDay();
  const daysInMonth = new Date(calendarYear,calendarMonth+1,0).getDate();

  const totalCells = Math.ceil((offset + daysInMonth) / 7) * 7;

  const today = new Date();

  const events = [];

  getFilteredApplications().forEach(app => {
    visibleVisits(app).forEach(visit => {
      if(
        visit.confirmed &&
        ["確定済み","見学済み"].includes(visit.status)
      ){
        events.push({
          appId:app.id,
          child:app.child,
          ...visit
        });
      }
    });
  });

  let html = "";

  ["日","月","火","水","木","金","土"].forEach(day => {
    html += `<div class="weekday">${day}</div>`;
  });

  for(let i=0;i<totalCells;i++){
    const date = new Date(calendarYear,calendarMonth,i-offset+1);

    const y = date.getFullYear();
    const m = String(date.getMonth()+1).padStart(2,"0");
    const d = String(date.getDate()).padStart(2,"0");

    const dateKey = `${y}-${m}-${d}`;

    const other = date.getMonth() !== calendarMonth;
    const isToday =
      date.getFullYear() === today.getFullYear() &&
      date.getMonth() === today.getMonth() &&
      date.getDate() === today.getDate();

    const dayEvents = events
      .filter(e => e.confirmed === dateKey)
      .sort((a,b) => a.time.localeCompare(b.time));

    html += `
      <div class="day ${other ? "other" : ""} ${isToday ? "today" : ""}">
        <div class="day-number">${date.getDate()}</div>

        ${dayEvents.map(e => `
          <button
            class="event"
            style="
              border-left-color:${gardenColors[e.garden]};
              background:${gardenColors[e.garden]}15;
            "
            onclick="openDetail('${e.appId}')"
            title="${escapeHTML(e.garden)} ${escapeHTML(e.child)}"
          >
            <span class="event-time">${escapeHTML(e.time)}</span>
            ${escapeHTML(e.garden)}<br>
            ${escapeHTML(e.child)}
          </button>
        `).join("")}
      </div>
    `;
  }

  $("calendarGrid").innerHTML = html;
}

function changeMonth(delta){
  const date = new Date(calendarYear,calendarMonth+delta,1);
  calendarYear = date.getFullYear();
  calendarMonth = date.getMonth();
  renderCalendar();
}

function goToday(){
  const today = new Date();
  calendarYear = today.getFullYear();
  calendarMonth = today.getMonth();
  renderCalendar();
}

function infoRow(label,value){
  return `
    <div class="info-row">
      <div class="info-label">${escapeHTML(label)}</div>
      <div class="info-value">${escapeHTML(value || "未登録")}</div>
    </div>
  `;
}

function openDetail(id){
  const app = applications.find(a => a.id === id);
  if(!app) return;

  const visitCards = app.visits.map(v => `
    <div class="visit-card">
      <div class="visit-card-head">
        <div class="visit-garden">${gardenLabel(v.garden)}</div>
        ${badge(v.status)}
      </div>

      <div class="visit-info">
        <strong>第1希望：</strong>
        ${escapeHTML(v.wishes[0] || "未登録")}
      </div>

      <div class="visit-info">
        <strong>第2希望：</strong>
        ${escapeHTML(v.wishes[1] || "未登録")}
      </div>

      <div class="visit-info">
        <strong>確定日時：</strong>
        ${
          v.confirmed
          ? `${escapeHTML(formatDate(v.confirmed))} ${escapeHTML(v.time)}`
          : "未確定"
        }
      </div>
    </div>
  `).join("");

  $("detailBody").innerHTML = `
    <div class="profile">
      <div class="profile-name">${escapeHTML(app.child)}</div>

      <div class="profile-sub">
        ${escapeHTML(app.guardian)} 様
      </div>

      <div style="margin-top:15px">
        ${
          app.visits.length > 1
          ? `<span class="pill multi">複数園 ${app.visits.length}園</span>`
          : `<span class="pill fixed">1園申込</span>`
        }
      </div>
    </div>

    <div class="detail-section">
      <h3>お子さま・保護者情報</h3>
      ${infoRow("お子さま",app.child)}
      ${infoRow("生年月日",app.birthday)}
      ${infoRow("保護者名",app.guardian)}
      ${infoRow("電話番号",app.phone)}
    </div>

    <div class="detail-section">
      <h3>園ごとの見学申込</h3>
      ${visitCards}
    </div>

    <div class="detail-section">
      <h3>事前シート</h3>
      ${
        app.previsit
        ? `<span class="pill fixed">回答済み・共通</span>`
        : `<span class="pill new">未回答</span>`
      }

      <div class="muted" style="margin-top:12px">
        同じお子さまの複数園申込で、事前シートを共有します。
      </div>
    </div>

    <div class="demo-note">
      現在はデザイン確認用の試作版です。<br>
      実際の申込情報の取得・変更・保存機能は、
      Google Apps Script接続時に実装します。
    </div>
  `;

  $("modal").classList.add("open");
  document.body.style.overflow = "hidden";
}

function closeDetail(){
  $("modal").classList.remove("open");
  document.body.style.overflow = "";
}

function closeOnOverlay(event){
  if(event.target === $("modal")) closeDetail();
}

document.addEventListener("keydown",event => {
  if(event.key === "Escape") closeDetail();
});

function renderAll(){
  renderStats();
  renderList();
  renderCalendar();
}

renderAll();
</script>

</body>
</html>
