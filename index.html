div></section><section class="view" id="calendarView"><div class="panel"><div class="panel-head"><div><div class="panel-title">見学予定カレンダー</div><div class="panel-sub">確定した見学予定を園別に表示</div></div><div class="calendar-toolbar"><button class="icon-btn" onclick="changeMonth(-1)">‹</button><div class="month-title" id="monthTitle"></div><button class="icon-btn" onclick="changeMonth(1)">›</button><button class="icon-btn" onclick="goToday()">今日</button></div></div><div class="calendar-grid" id="calendarGrid"></div><div class="calendar-note">予定をクリックすると、申込者の詳細を確認できます。</div></div></section></main></div>

<script>
"use strict";
const CLIENT_ID="357085830532-ckltj936bt4bc8p0712bj92m1gg25llv.apps.googleusercontent.com";
const USERS={
"umejima.child.takahiro@gmail.com":{role:"本部",garden:"all"},
"k-takahashi@linkup6.com":{role:"本部",garden:"all"},
"tortoise.nursery@gmail.com":{role:"南花畑園",garden:"南花畑園"},
"tortoise.umejima@gmail.com":{role:"梅島園",garden:"梅島園"},
"tortoise.hokima@gmail.com":{role:"保木間園",garden:"保木間園"},
"chibiccoland-rokucho@linkup6.com":{role:"ちびっこランド",garden:"ちびっこランド"},
"chibicco6-director@linkup6.com":{role:"ちびっこランド",garden:"ちびっこランド"}
};
let applications=[];
let adminToken='';
// GASの公開URLを設定してください（末尾は /exec）。
const GAS_WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbwZaCZuEWMom6YFsxJ40O-fvVx_5LQH7EnZ4haHiby7r2w48EK_WO5czHHkbRVPHKqxVA/exec';
let requestSeq=0;
const pending=new Map();
function bridgeRequest(action,payload={}){
 return new Promise((resolve,reject)=>{
  if(!/^https:\/\/script\.google\.com\/macros\/s\/.+\/exec$/.test(GAS_WEB_APP_URL)){
   reject(new Error('GASのURLが未設定です。'));return;
  }
  const id='req_'+(++requestSeq)+'_'+Date.now();
  const frame=document.createElement('iframe');frame.name=id;frame.style.display='none';
  const form=document.createElement('form');form.method='POST';form.action=GAS_WEB_APP_URL;
  form.target=id;form.style.display='none';
  const fields={adminBridge:'1',requestId:id,idToken:adminToken,action,payload:JSON.stringify(payload)};
  for(const [key,value] of Object.entries(fields)){
   const input=document.createElement('input');input.type='hidden';input.name=key;input.value=value;form.appendChild(input);
  }
  document.body.append(frame,form);
  const timeout=setTimeout(()=>finish(new Error('通信がタイムアウトしました。GASの公開設定とURLを確認してください。')),30000);
  function finish(error,result){clearTimeout(timeout);pending.delete(id);form.remove();frame.remove();error?reject(error):resolve(result)}
  pending.set(id,finish);form.submit();
 });
}
window.addEventListener('message',event=>{
 // GAS HTML Serviceの応答のみを受信。IDは推測困難なリクエスト単位。
 if(!/^https:\/\/[a-z0-9-]+\.googleusercontent\.com$/.test(event.origin) &&
    event.origin!=='https://script.google.com')return;
 const d=event.data;
 if(!d||d.type!=='CCS_ADMIN_BRIDGE'||typeof d.requestId!=='string')return;
 const done=pending.get(d.requestId);if(!done)return;
 done(d.success?null:new Error(d.message||'通信に失敗しました。'),d.result);
});
function reloadApplications(){
 if(!adminToken)return;
 bridgeRequest('read').then(result=>{
   const grouped=new Map();
   for(const item of result.items){
     const key=(item.lineUserId||item.guardian+'|'+item.phone)+'|'+item.child+'|'+item.birthday;
     if(!grouped.has(key))grouped.set(key,{id:item.id,appliedAt:item.appliedAt,
                                           lineDisplayName:item.lineDisplayName || '',
                                           child:item.child,birthday:item.birthday,guardian:item.guardian,phone:item.phone,previsit:false,previsitDetails:null,visits:[]});
     const a=grouped.get(key);
    if (!a.lineDisplayName && item.lineDisplayName) {
  a.lineDisplayName = item.lineDisplayName;
}
    a.previsit=a.previsit||item.previsit;if(item.previsit&&item.previsitDetails)a.previsitDetails=item.previsitDetails;
     a.visits.push({id:item.id,garden:item.garden,status:item.status,wishes:item.wishes,confirmed:item.confirmed,time:item.time,memo:item.memo,desiredDays:item.desiredDays||"",careStart:item.careStart||"",careEnd:item.careEnd||"",previsit:item.previsit});
   }
   applications=[...grouped.values()];renderAll();
 }).catch(err=>{alert('申込データを取得できません：'+err.message)});
}
const statuses=[{name:"未対応",className:"new"},{name:"日程調整",className:"adjust"},{name:"確定済み",className:"fixed"},{name:"見学済み",className:"done"},{name:"キャンセル",className:"cancel"}];
const gardenColors={"南花畑園":"#148b78","梅島園":"#688ad0","保木間園":"#d29a59","ちびっこランド":"#bb83b7"};
const $=id=>document.getElementById(id);const esc=x=>String(x??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");
let activeStatus="all",selectedGarden="all",currentView="list",currentUser=null;const now=new Date();let calendarYear=now.getFullYear(),calendarMonth=now.getMonth();



/* Google Identity Services: Google認証結果を表示する試作です。実運用ではIDトークンをサーバー側で検証する必要があります。 */
// ============================================================
// Googleログイン・自動ログイン管理
// ============================================================

function startGoogleLogin() {
  if (!window.google?.accounts?.id) {
    $("loginError").textContent =
      "Googleログインの読み込みを待って、もう一度お試しください。";
    return;
  }

  $("loginError").textContent = "";

  google.accounts.id.prompt(notification => {
    if (
      notification.isNotDisplayed() ||
      notification.isSkippedMoment()
    ) {
      $("loginError").textContent =
        "自動ログインできない場合は、下のGoogleログインボタンをご利用ください。";
    }
  });
}


// JWT解析
function decodeJWT(token) {
  const part = token.split(".")[1];

  if (!part) {
    throw Error("Invalid token");
  }

  const b64 = part.replace(/-/g, "+").replace(/_/g, "/");

  const bytes = Uint8Array.from(
    atob(b64),
    c => c.charCodeAt(0)
  );

  return JSON.parse(
    new TextDecoder().decode(bytes)
  );
}


// Google認証成功時
function handleCredential(response) {
  try {
    const data = decodeJWT(response.credential);

    const email = String(
      data.email || ""
    ).toLowerCase();

    if (
      data.aud !== CLIENT_ID ||
      !data.email_verified ||
      !data.exp ||
      data.exp * 1000 <= Date.now() ||
      !USERS[email]
    ) {
      $("loginError").textContent =
        "このGoogleアカウントは登録されていません。";
      return;
    }

    adminToken = response.credential;

    currentUser = {
      email,
      ...USERS[email]
    };

    // ログイン画面を閉じる
    $("loginPage").hidden = true;
    $("app").hidden = false;

    $("loginPage").style.display = "none";
    $("app").style.display = "flex";

    $("userRole").textContent =
      currentUser.role;

    $("userAvatar").textContent =
      currentUser.role === "本部"
        ? "本"
        : currentUser.role.charAt(0);

    selectGarden(currentUser.garden);

    reloadApplications();

  } catch (e) {
    console.error(e);

    $("loginError").textContent =
      "ログイン情報を確認できませんでした。";
  }
}


// Googleログイン初期化
function initGoogle() {

  if (!window.google?.accounts?.id) {
    setTimeout(initGoogle, 300);
    return;
  }

  google.accounts.id.initialize({
    client_id: CLIENT_ID,
    callback: handleCredential,

    // Googleアカウントを自動選択
    auto_select: true,

    ux_mode: "popup"
  });

  // Googleログインボタン
  google.accounts.id.renderButton(
    $("googleButton"),
    {
      type: "standard",
      theme: "outline",
      size: "large",
      text: "signin_with",
      shape: "pill",
      width: 250
    }
  );

  // ページ更新時に自動ログインを試みる
  google.accounts.id.prompt();
}


// ページ読み込み時
window.addEventListener(
  "load",
  initGoogle
);


// ログアウト
function logout() {

  currentUser = null;
  adminToken = "";
  applications = [];

  // 明示的にログアウトした場合は自動ログインを停止
  google?.accounts?.id?.disableAutoSelect();

  $("app").style.display = "none";
  $("loginPage").style.display = "grid";

async function printVisitSheet(managementId) {

  if (!adminToken) {
    alert('Googleログインをやり直してください。');
    return;
  }

  // 非同期通信前にウィンドウを開く
  // ポップアップブロックを避ける
  const win = window.open('', '_blank');

  if (!win) {
    alert('印刷画面を開けません。ポップアップを許可してください。');
    return;
  }

  win.document.write(
    '<!doctype html><html lang="ja">' +
    '<head><meta charset="UTF-8">' +
    '<title>印刷準備中</title></head>' +
    '<body>印刷データを取得しています…</body></html>'
  );

  try {

    const data = await bridgeRequest('print', {
      id: managementId
    });

    renderVisitPrintWindow(win, data);

  } catch (err) {

    win.document.body.textContent =
      '印刷データの取得に失敗しました：' +
      err.message;

  }
}

  const get = (fields, col) => {

      x => Number(x.column) === col
    );

  };

  // ----------------------------------------------------------
  // 帳票の共通部品
  // ----------------------------------------------------------

  const row = (title, value = '', extraClass = '') => `

      ? {

<style>

/* ==========================================================
   A4印刷設定
========================================================== */

@page {
  size: A4 portrait;
  margin: 7mm;
}

* {
  box-sizing: border-box;
}

html,
body {

  padding: 0;
}

body {

    "Yu Gothic",
    "Meiryo",

  background: white;
  font-size: 8.5px;

/* ==========================================================
   用紙
========================================================== */

/* ==========================================================

========================================================== */

.p-header {

.p-header h1 {

.p-subtitle {

}

.p-created {

}

/* ==========================================================
   上段レイアウト

   左右の高さをそろえる
========================================================== */

.p-main {

  grid-template-columns:
    minmax(0, 2.05fr)
    minmax(0, 0.95fr);

}

.p-left,

}

/* 右側は縦方向に配置 */

.p-right {
  display: flex;
  flex-direction: column;
}

/* ==========================================================
   共通の枠
========================================================== */

.p-box {
  margin-bottom: 7px;

  border: 1px solid #888;
  border-radius: 3px;

  overflow: hidden;

  break-inside: avoid;
  page-break-inside: avoid;
}

.p-box-title {
  padding: 5px 8px;

  background: #414141;
  color: white;

  font-size: 10px;
  font-weight: 800;
}

.p-box-body {
  padding: 0;
}

.p-row {
  display: grid;

  grid-template-columns:
    95px
    minmax(0, 1fr);

  border-top: 1px solid #d4d4d4;

  min-height: 18px;
}

.p-row:first-child {
  border-top: none;
}

.p-label {
  padding: 3px 5px;

  background: #f3f3f3;

  border-right: 1px solid #d4d4d4;

  font-weight: 700;

  overflow-wrap: anywhere;
}

.p-value {
  padding: 3px 5px;

  white-space: pre-wrap;

  overflow-wrap: anywhere;
}

/* ==========================================================
   お母さま・お父さま

   左右2列
========================================================== */

.p-parents {
  display: grid;

  grid-template-columns:
    minmax(0, 1fr)
    minmax(0, 1fr);

  gap: 6px;

  align-items: stretch;
}

/* 父母の枠の高さをそろえる */

.p-parents .p-box {
  height: 100%;
  margin-bottom: 0;
}

.p-parents .p-row {
  grid-template-columns:
    67px
    minmax(0, 1fr);

  min-height: 18px;
}

.p-parents .p-label,
.p-parents .p-value {
  font-size: 7.5px;
  padding: 3px;
}

/* ==========================================================
   見学情報
========================================================== */

.p-visit .p-row {
  grid-template-columns:
    73px
    minmax(0, 1fr);

  min-height: 29px;
}

/* ==========================================================
   職員記入メモ

   ・点線なし
   ・白紙
   ・4番、5番の下端で終了
========================================================== */

.p-staff-memo {
  flex: 1;

  display: flex;
  flex-direction: column;

  min-height: 0;

  margin-bottom: 0;
}

.p-staff-memo .p-box-body {
  flex: 1;

  padding: 9px;

  min-height: 0;
}

.p-existing-memo {
  white-space: pre-wrap;

  overflow-wrap: anywhere;

  font-size: 9px;
}

/* ==========================================================
   6. その他・ご相談内容

   上段の左右の下に配置
   A4の横幅いっぱいに表示
========================================================== */

.p-bottom {

  margin-top: 8px;
}

.p-bottom .p-box {

/* 6番の項目 */

/* 質問・連絡事項は広め */

/* ==========================================================

========================================================== */

.print-tools {

.print-tools button {

/* ==========================================================

========================================================== */

  // ----------------------------------------------------------

  win.document.open();
  win.document.write(html);

</script>

<!-- ==========================================
     見学管理：最新情報更新ボタン
========================================== -->
<script>
(function () {

  function setupRefreshButton() {

    // 二重設置防止
    if (document.getElementById('ccsRefreshButton')) return;

    // ログアウトボタンを探す
    const logoutButton = Array.from(
      document.querySelectorAll('button')
    ).find(btn => btn.textContent.includes('ログアウト'));

    if (!logoutButton) return;

    // 更新ボタンを作成
    const button = document.createElement('button');

    button.id = 'ccsRefreshButton';
    button.type = 'button';
    button.textContent = '↻ 最新情報に更新';

    button.style.cssText = `
      padding: 10px 16px;
      border-radius: 10px;
      border: 1px solid #d5e5e1;
      background: #ffffff;
      color: #168b78;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      white-space: nowrap;
      margin-right: 10px;
    `;

    // ログアウトボタンの左に配置
    logoutButton.parentNode.insertBefore(
      button,
      logoutButton
    );

    button.addEventListener('click', async function () {

      if (button.disabled) return;

      button.disabled = true;
      button.textContent = '↻ 更新中…';

      try {

        await reloadApplications();

        button.textContent = '✓ 更新しました';

        setTimeout(() => {
          button.textContent = '↻ 最新情報に更新';
          button.disabled = false;
        }, 1800);

      } catch (error) {

        console.error(error);

        button.textContent = '更新に失敗しました';

        setTimeout(() => {
          button.textContent = '↻ 最新情報に更新';
          button.disabled = false;
        }, 2500);

      }

    });

  }

  // ページ読み込み後に設置
  if (document.readyState === 'loading') {
    document.addEventListener(
      'DOMContentLoaded',
      setupRefreshButton
    );
  } else {
    setupRefreshButton();
  }

})();
</script>
 <!-- ============================================
     見学管理：新着順・検索・並び替え
============================================= -->
<script>
(function () {
  'use strict';

  let sortMode = 'newest';
  let searchWord = '';

  // 申込日時を比較用の数値に変換
  function getAppliedTime(a) {
  const value = String(a.appliedAt || '').trim();
  if (!value) return 0;

  // 例：2026/10/14 15:30:00
  // 例：2026-10-14 15:30
  // 例：2026年10月14日 15:30
  const match = value.match(
    /(\d{4})[\/\-年](\d{1,2})[\/\-月](\d{1,2})日?\s*(\d{1,2})?:?(\d{1,2})?:?(\d{1,2})?/
  );

  if (match) {
    const year = Number(match[1]);
    const month = Number(match[2]) - 1;
    const day = Number(match[3]);
    const hour = Number(match[4] || 0);
    const minute = Number(match[5] || 0);
    const second = Number(match[6] || 0);

    return new Date(year, month, day, hour, minute, second).getTime();
  }

  const parsed = Date.parse(value);
  return Number.isFinite(parsed) ? parsed : 0;
}

  // 見学予定日を比較
  function getVisitTime(a) {
    if (!Array.isArray(a.visits)) return Infinity;

    const dates = a.visits
      .filter(v => v.confirmed)
      .map(v => {
        const date = String(v.confirmed || '').replace(/\//g, '-');
        const time = String(v.time || '00:00');
        const parsed = Date.parse(date + 'T' + time);
        return Number.isFinite(parsed) ? parsed : Infinity;
      });

    return dates.length ? Math.min(...dates) : Infinity;
  }

  // 検索・並び替えを既存処理に追加
  const originalGetFilteredApplications = getFilteredApplications;

getFilteredApplications = function () {
  let result = originalGetFilteredApplications();

  if (searchWord) {
    result = result.filter(a => {
      const target = [
        a.child,
        a.guardian,
        a.id
      ].join(' ').toLowerCase();

      return target.includes(searchWord);
    });
  }

  return [...result].sort((a, b) => {
    if (sortMode === 'visit') {
      return getVisitTime(a) - getVisitTime(b);
    }

    const timeA = getAppliedTime(a);
    const timeB = getAppliedTime(b);

    return sortMode === 'oldest'
      ? timeA - timeB
      : timeB - timeA;
  });
};

  function setupSearchAndSort() {
    if (document.getElementById('ccsSortSelect')) return;

    const searchInput = document.getElementById('searchInput');

    if (!searchInput) return;

    // 並び替えメニュー
    const select = document.createElement('select');
    select.id = 'ccsSortSelect';

    select.innerHTML = `
      <option value="newest">申込が新しい順</option>
      <option value="oldest">申込が古い順</option>
      <option value="visit">見学予定日順</option>
    `;

    select.style.cssText = `
      padding: 11px 12px;
      border: 1px solid #e0e8e5;
      border-radius: 10px;
      background: #ffffff;
      color: #344b45;
      font-size: 13px;
      cursor: pointer;
      max-width: 180px;
    `;

    select.addEventListener('change', function () {
      sortMode = this.value;
      renderList();
    });

    // 既存の検索欄を利用
    searchInput.addEventListener('input', function () {
      searchWord = this.value.trim().toLowerCase();
      renderList();
    });

    searchInput.placeholder = 'お子さま・保護者名で検索';

    const parent = searchInput.parentElement;
    parent.style.display = 'flex';
    parent.style.gap = '10px';
    parent.style.alignItems = 'center';

    parent.insertBefore(select, searchInput);
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', setupSearchAndSort);
  } else {
    setupSearchAndSort();
  }
})();
</script>
</body></html>
